name: Java CI with Maven

on:
  push:
    branches:
      - main
      - issue-*

  pull_request:
    branches:
      - main
      - issue-*

permissions:
  statuses: write
  checks: write
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start Practice Software Testing with Docker Compose
        run: docker compose -f docker-compose-toolshop.yml up -d

      - name: Sleep for 30 seconds
        run: sleep 30s
        shell: bash

      - name: Wait for MariaDB
        run: |
          until docker compose -f docker-compose-toolshop.yml exec -T mariadb \
            mysqladmin ping -h localhost -uroot -proot --silent; do
            echo "Waiting for MariaDB..."
            sleep 5
          done

      - name: Create and Seed Database
        run: |
          docker compose -f docker-compose-toolshop.yml exec laravel-api php artisan migrate:fresh --seed
      - name: Wait for Angular UI to be ready 🕐
        run: |
          echo "Waiting for Angular UI on port 4200..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 | grep -q "200"; then
              echo "Angular UI is ready!"
              exit 0
            fi
            echo "Attempt $i/60 - not ready yet, waiting 5s..."
            sleep 5
          done
          echo "Angular UI failed to start within 5 minutes"
          docker compose logs angular-ui
          exit 1

      - name: Build Project and run tests
        run: mvn clean install

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots
          path: screenshots

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Test Results
          path: ${{ github.workspace }}/target/surefire-reports/TEST-TestSuite.xml
          reporter: java-junit
          java-version: 17