name: Java CI with Maven

on:
  push:
    branches:
      - main
      - issue-*

  pull_request:
    branches:
      - main
      - issue-*

permissions:
  statuses: write
  checks: write
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start Practice Software Testing with Docker Compose
        run: docker compose -f docker-compose-toolshop.yml up -d

      - name: Sleep for 60 seconds
        run: sleep 60s
        shell: bash
      - name: Wait for MariaDB
        run: |
          until docker compose -f docker-compose-toolshop.yml exec -T mariadb \
            mysqladmin ping -h localhost -uroot -proot --silent; do
            echo "Waiting for MariaDB..."
            sleep 5
          done

      - name: Create and Seed Database
        run: |
          docker compose -f docker-compose-toolshop.yml exec laravel-api php artisan migrate:fresh --seed
      - name: Wait for application
        run: |
          until curl -f http://localhost:4200; do
            echo "Waiting for application..."
            sleep 5
          done

      - name: Build Project and run tests
        run: mvn clean install

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots
          path: screenshots

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Test Results
          path: ${{ github.workspace }}/target/surefire-reports/TEST-TestSuite.xml
          reporter: java-junit
          java-version: 17